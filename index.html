<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>数覚バトル ナンバーコア！</title><link rel="stylesheet" href="style.css?v=20260905-3"></head><body>
<header class="topbar"><div class="brand">数覚バトル <b>ナンバーコア！</b></div><div class="top-actions"><label>CORE <select id="coreSelect"><option>20</option><option selected>30</option><option>50</option><option>100</option></select></label><button id="restartBtn">もう一度</button></div></header>
<main class="game-shell">
<section class="player-side card"><div class="side-title">あなた</div><div class="fantasy-hero"><img id="playerFantasyImage" alt="ナビキャラ"><div id="playerFantasyName"></div></div><div class="hp-label"><span>HP</span><b id="playerHpText">HP 10 / 10</b></div><div class="hp-track"><i id="playerHpBar"></i></div></section>
<section class="battle card"><div class="battle-head"><div><div class="eyebrow">目標</div><div id="coreNumber" class="core-number">30</div></div><div class="timer-box"><span>のこり</span><b id="timer">20</b><small>秒</small></div></div><div id="battleBackground" class="battle-scene"><div class="scene-player"><img id="playerFantasyImageScene" alt=""><div id="playerFantasyNameScene"></div><div class="scene-hp"><i id="playerHpBarScene"></i></div></div><div class="vs">VS</div><div class="scene-enemy"><div id="enemyName" class="enemy-name">モンスター</div><img id="enemyImage" alt="モンスター"><div id="enemyAbility" class="enemy-ability"></div><div id="enemyThought" class="enemy-thought"></div><div id="enemyFormula" class="enemy-formula"></div><div id="enemyCommand" class="enemy-command"></div><div class="scene-hp"><i id="enemyHpBar"></i></div><div id="enemyHpText">HP 10 / 10</div></div></div></section>
<section class="calculator card"><div class="section-title">式をつくろう</div><div id="targetHint" class="target-hint"><b id="targetMain">CORE 30</b><span id="targetSub">数字を作ろう</span></div><div id="strategyPanel" class="strategy-panel"><div class="section-title">今回の作戦</div><div class="strategy-buttons"><button data-s="just">JUSTをねらう</button><button data-s="near">できるだけ近づく</button><button data-s="safe">安全に戦う</button></div><div id="strategyText" class="strategy-text"></div></div><div id="expression" class="expression">数字を2〜3枚選択してください</div><div id="numberDistance" class="distance-text">計算式を完成させよう</div><div id="operatorHint" class="operator-hint"></div><div id="operators" class="operators"><button data-op="+">＋</button><button data-op="-">−</button><button data-op="*">×</button><button data-op="/">÷</button></div><button id="executeBtn" class="submit">この式でいく！</button></section>
<section class="hand-area card"><div class="hand-title">手札 <span id="handCount"></span></div><div id="hand" class="hand"></div><button id="changeBtn" class="change">カードを1枚交換</button></section>
<section class="strategy card"><div class="section-title">コマンド</div><div id="commandCards" class="command-cards"></div><div class="range-title">COREとの距離</div><div id="rangeGuide" class="range-guide"></div><div class="discoveries"><div><b id="discoveryCount">0</b><span>発見した式</span></div><div><b id="methodTitle">みんなの30</b><span id="methodExamples">まだ発見なし。</span></div></div></section>
<section class="enemy-side card"><div class="side-title">相手</div><div id="enemyNameSide" class="side-enemy-name">モンスター</div><img id="enemyImageSide" alt=""><div id="enemyCoreSide">30</div><div id="cpuPersonality"></div><div class="hp-label"><span>HP</span><b id="cpuHp">10</b></div><div class="hp-track"><i id="enemyHpBarSide"></i></div><div id="enemyHpTextSide">HP 10 / 10</div></section>
</main>
<section id="overlay" class="overlay hidden"><div class="overlay-card"><div id="resultEmoji" class="result-emoji">WIN</div><div id="resultTitle"></div><div id="resultText"></div><div id="resultExtra"></div><button id="nextBtn">次のバトルへ</button></div></section>
<div id="comboHud" class="combo-hud"><span>JUST COMBO</span><b id="comboCount">0</b><small id="powerState">JUSTでチャージ</small></div><div id="statusMessage" class="status"></div><div id="skillLabel" class="skill-label"></div><div id="log" class="log"></div>
<script>window.__NUMBER_CORE_START_SCREEN__=true;</script>
<script src="script.js?v=20260905-3"></script><script src="start-screen.js?v=20260905-3"></script></body></html>
